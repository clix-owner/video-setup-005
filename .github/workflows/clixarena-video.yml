name: CLIXARENA video encode and upload
run-name: CLIXARENA · ${{ inputs.output_name }} · ${{ inputs.job_id || inputs.subtitle_path }}
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: Direct HTTPS video URL (inputs are visible to repository users)
        required: true
        type: string
      output_name:
        description: Video filename (with or without .mp4)
        required: true
        default: CLIXARENA.mp4
        type: string
      overlay_layout:
        description: Preview layout JSON (set by portal; blank uses defaults)
        type: string
        required: false
      overlay_name:
        description: Separate title shown in video (blank uses filename)
        type: string
        required: false
      subtitle_method:
        description: Burn or Sinhala-only switchable subtitles in MP4
        required: true
        type: choice
        default: burn
        options:
          - burn
          - soft
          - transfer
      sample_only:
        description: Encode first 3 minutes for preview (no Streamtape upload)
        required: true
        default: false
        type: boolean
      subtitle_path:
        description: auto picks the only SRT uploaded to subtitles/ (any filename), or enter its path
        default: auto
        required: true
        type: string
      font_path:
        description: Repository path to licensed Iskoola Pota TTF
        default: fonts/IskoolaPota.ttf
        required: true
        type: string
      quality:
        description: Output resolution and quality (never upscales)
        required: true
        default: 720p - Balanced
        type: choice
        options:
          - Original - High
          - 1080p - High
          - 720p - High
          - Original - Balanced
          - 1080p - Balanced
          - 720p - Balanced
      crf:
        description: CRF 0-51 (lower = higher quality/larger file); auto uses High 18 or Balanced 23
        required: true
        default: 'auto'
        type: string
      audio_track:
        description: auto, zero-based track number (0, 1...), or language code (eng, hin...)
        required: true
        default: auto
        type: string
      tmdb_url:
        description: TMDB movie/TV URL for English original logo (blank disables title overlay)
        required: false
        type: string
      title_animation:
        description: Enable title animation
        type: boolean
        default: true
        required: true
      show_logo:
        description: Show English title logo (requires TMDB URL)
        type: boolean
        default: true
        required: true
      show_name:
        description: Show output name
        type: boolean
        default: true
        required: true
      show_message:
        description: Show Sinhala message
        type: boolean
        default: true
        required: true
      overlay_start:
        description: Title animation start (seconds or HH:MM:SS)
        required: true
        default: '5'
        type: string
      overlay_duration:
        description: Title animation duration in seconds (4 to 60)
        required: true
        default: '8'
        type: string
      source_commit:
        description: Uploaded subtitle commit (set automatically by the Vercel page)
        required: false
        type: string
      job_id:
        description: Portal tracking ID (set automatically by the Vercel page)
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: clixarena-video-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  encode:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - name: Install media tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core
      - name: Download, validate, encode and upload
        id: video
        env:
          MAPPING_GITHUB_TOKEN: ${{ github.token }}
          VIDEO_URL: ${{ inputs.video_url }}
          OVERLAY_LAYOUT: ${{ inputs.overlay_layout }}
          OVERLAY_NAME: ${{ inputs.overlay_name }}
          OUTPUT_NAME: ${{ inputs.output_name }}
          SUBTITLE_METHOD: ${{ inputs.subtitle_method }}
          SAMPLE_ONLY: ${{ inputs.sample_only }}
          SUBTITLE_PATH: ${{ inputs.subtitle_path }}
          FONT_PATH: ${{ inputs.font_path }}
          CRF: ${{ inputs.crf }}
          QUALITY: ${{ inputs.quality }}
          PORTAL_JOB_ID: ${{ inputs.job_id }}
          AUDIO_TRACK: ${{ inputs.audio_track }}
          TMDB_URL: ${{ inputs.tmdb_url }}
          TITLE_ANIMATION: ${{ inputs.title_animation }}
          SHOW_LOGO: ${{ inputs.show_logo }}
          SHOW_NAME: ${{ inputs.show_name }}
          SHOW_MESSAGE: ${{ inputs.show_message }}
          OVERLAY_START: ${{ inputs.overlay_start }}
          OVERLAY_DURATION: ${{ inputs.overlay_duration }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          STREAMTAPE_LOGIN: ${{ secrets.STREAMTAPE_LOGIN }}
          STREAMTAPE_KEY: ${{ secrets.STREAMTAPE_KEY }}
        run: python3 scripts/clixarena_video.py
      - name: Saved video mapping
        if: ${{ always() && !inputs.sample_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CLIXARENA-mapping
          path: mapping-result.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Downloadable sample
        if: ${{ inputs.sample_only && success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CLIXARENA-sample
          path: preview/sample.mp4
          if-no-files-found: error
          retention-days: 3
      - name: Sinhala subtitle companion
        if: ${{ inputs.subtitle_method == 'soft' && success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CLIXARENA-Sinhala-subtitle
          path: preview/sinhala.srt
          if-no-files-found: error
          retention-days: 3
      - name: Failure guidance
        if: failure()
        run: echo '::error::Check the stage message above. Verify video URL, repository SRT/font paths, UTF-8 SRT, licensed Iskoola Pota font, disk space and Streamtape secrets. Uploads are not retried automatically; check your Streamtape account before rerunning.'
