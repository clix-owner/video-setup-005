name: CLIXARENA successful run cleanup
on:
  workflow_run:
    workflows: [CLIXARENA video encode and upload]
    types: [completed]
permissions:
  actions: write
  contents: write
jobs:
  cleanup:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Save success receipt and remove completed video run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
          TARGET_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          TARGET_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, random, time, urllib.error, urllib.request
          repo = os.environ['TARGET_REPO']
          run_id = os.environ['TARGET_RUN_ID']
          workflow_id = os.environ['TARGET_WORKFLOW_ID']
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo) or not run_id.isdigit() or not workflow_id.isdigit():
              raise SystemExit('Invalid cleanup target')
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
          def request(path, method='GET', payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request('https://api.github.com/repos/' + repo + path, data=data, headers=headers, method=method)
              with opener.open(req, timeout=30) as response:
                  body = response.read(1024 * 1024)
                  return json.loads(body) if body else None
          try:
              path = '/actions/runs/' + run_id
              run = request(path)
              # Identify the workflow by its event ID; custom run titles can vary.
              if run.get('status') != 'completed' or run.get('conclusion') != 'success' or run.get('event') != 'workflow_dispatch' or str(run.get('workflow_id')) != workflow_id:
                  print('Cleanup skipped: target is not a completed successful video workflow run.')
                  raise SystemExit(0)
              # Preserve safe portal status before deleting the run and its artifacts.
              match = re.search(r'(?:\s|·)([a-f0-9]{32})\s*$', run.get('display_title', ''))
              if match:
                  receipt_path = '/contents/.clixarena/completed/' + match[1] + '.json'
                  receipt = {'job': match[1], 'status': 'completed', 'conclusion': 'success', 'number': run.get('run_number'), 'historyRemoved': True}
                  for attempt in range(12):
                      try:
                          current = request(receipt_path)
                      except urllib.error.HTTPError as error:
                          if error.code != 404:
                              raise
                          current = None
                      payload = {'message': 'Record successful CLIXARENA run', 'branch': os.environ['DEFAULT_BRANCH'], 'content': base64.b64encode(json.dumps(receipt).encode()).decode()}
                      if current:
                          payload['sha'] = current['sha']
                      try:
                          request(receipt_path, 'PUT', payload)
                          break
                      except urllib.error.HTTPError as error:
                          if error.code != 409 or attempt == 11:
                              raise
                          time.sleep(random.uniform(0.15, 1.0) * min(3, 1 + attempt // 4))
              request(path, 'DELETE')
              print('Successful video run removed from Actions history.')
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  print('Cleanup target unavailable (HTTP 404); removal could not be confirmed.')
              else:
                  raise SystemExit('Cleanup request rejected (HTTP ' + str(error.code) + '). No response body logged.')
          except Exception:
              raise SystemExit('Cleanup could not be confirmed. No credentials or API responses logged.')
          PY
